define:
  open home:
    params: [status]
    steps:
      - request: GET /
        expect: { status: "{{status}}" }

scenarios:
  - name: yaml wrong status
    steps:
      - request: GET /
        expect: { status: 201 }

  - name: yaml wrong json
    steps:
      - request: GET /json
        expect:
          json: { user: { name: bob } }

  - name: yaml unknown variable
    steps:
      - request: GET /users/{{userId}}

  - name: yaml stub never called
    steps:
      - stub: mail
        on: POST /send
        reply: { status: 202 }
      - received: mail
        call: POST /send

  - name: yaml failing inside use
    steps:
      - use: open home
        with: { status: 418 }

  - name: yaml log wait gives up before the test timeout
    steps:
      - log: this line is never printed

  - name: yaml header null passes when the header is absent
    steps:
      - request: GET /json
        expect:
          headers: { content-type: { $regex: json }, x-powered-by: null }

  - name: yaml header null fails when the header is sent
    steps:
      - request: GET /json
        expect:
          headers: { content-type: null }
