# yaml-language-server: $schema=../../../schema/scenario.schema.json
scenarios:
  - name: webhook on a request signs the body like the provider
    steps:
      - request: POST /webhooks/stripe
        webhook: { provider: stripe, secret: whsec_test }
        json: { type: checkout.session.completed }
        expect: { status: 200 }
      - request: POST /webhooks/stripe
        webhook: { provider: stripe, secret: whsec_test, invalidSignature: true }
        json: { type: checkout.session.completed }
        expect: { status: 400 }
      - request: GET /events
        expect:
          json: [{ source: stripe, type: checkout.session.completed }]

  - name: a LINE Messaging API delivery is signed with the channel secret
    steps:
      - request: POST /webhooks/line
        webhook: { provider: line, secret: line-secret }
        json: { destination: U1, events: [{ type: message, message: { type: text, text: こんにちは } }] }
        expect: { status: 200 }
      - request: POST /webhooks/line
        webhook: { provider: line, secret: line-secret, invalidSignature: true }
        json: { events: [{ type: message }] }
        expect: { status: 400 }
      - request: GET /events
        expect: { json: [{ source: line, type: message }] }

  - name: a Twilio status callback is signed over the URL and the form
    steps:
      - request: POST /webhooks/twilio
        webhook: { provider: twilio, secret: tw-token }
        form: { MessageSid: SM1, SmsStatus: delivered, To: "+819012345678" }
        expect: { status: 200 }
      - request: POST /webhooks/twilio
        webhook: { provider: twilio, secret: tw-token, url: "https://public.example.com/webhooks/twilio" }
        form: { MessageSid: SM2, SmsStatus: failed }
        expect: { status: 400 }
      - request: GET /events
        expect: { json: [{ source: twilio, type: delivered }] }
