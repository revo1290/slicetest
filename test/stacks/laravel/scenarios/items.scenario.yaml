# yaml-language-server: $schema=https://unpkg.com/slicetest/schema/scenario.schema.json
scenarios:
  - name: a row made in the scenario comes back from the app
    steps:
      - make: items
        rows: { name: tea }
      - request: GET /items
        expect: { status: 200, json: [{ id: 1, name: tea }] }
  - name: the next scenario starts empty
    steps:
      - request: GET /items
        expect: { status: 200, json: [] }
  - name: the welcome page renders
    steps:
      - request: GET /
        expect: { status: 200, text: { $contains: Laravel } }
