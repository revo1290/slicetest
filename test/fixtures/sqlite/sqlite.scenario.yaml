scenarios:
  - name: yaml against sqlite
    steps:
      - insert: authors
        rows: [{ name: ada }]
      - checkpoint: true
      - request: POST /posts
        json: { author: ada, title: From YAML }
        expect: { status: 201, json: { id: 1 } }
      - changes:
          posts: { inserted: [{ title: From YAML }] }

  - name: submitting a server-rendered form carries its CSRF token
    steps:
      - request: GET /signup
      - submit: Sign up
        fields: { name: grace, newsletter: true }
        follow: true
        expect: { status: 200, text: { $contains: "Welcome, grace (news)" } }
      - db: authors
        expect: { rows: [{ id: 1, name: grace (news) }] }

  - name: the token is what makes it pass
    steps:
      - request: GET /signup
      - request: POST /signup
        form: { csrf: forged, name: mallory, intent: join }
        expect: { status: 403 }

  - name: set names generated values once, for several steps
    steps:
      - set: { title: "post {{$seq}} on {{$today}}", other: "post {{$seq}}" }
      - insert: authors
        rows: [{ name: ada }]
      - request: POST /posts
        json: { author: ada, title: "{{title}}" }
        expect: { status: 201 }
      - db: posts
        expect: { rows: [{ title: "{{title}}" }] }
      - db: posts
        where: { title: "{{other}}" }
        expect: { count: 0 }
