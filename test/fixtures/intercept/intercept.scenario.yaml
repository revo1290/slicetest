scenarios:
  - name: a hard-coded HTTPS API is answered by its stub
    steps:
      - stub: weather
        on: GET /v1/now
        reply: { body: { temp_c: 21.5 } }
      - request: GET /weather?city=Tokyo
        expect: { status: 200, json: { city: Tokyo, temperature: 21.5 } }
      - received: weather
        call: GET /v1/now
        when: { query: { city: Tokyo }, headers: { authorization: Bearer weather-key, host: api.weather.test } }

  - name: an OAuth-style login goes through the provider's stubbed page and token endpoint
    steps:
      - stub: provider
        on: GET /authorize
        reply:
          status: 302
          headers: { location: "{{call.query.redirect_uri}}?code=c-1&state={{call.query.state}}" }
      - stub: provider
        on: POST /token
        when: { form: { code: c-1, client_id: app } }
        reply: { body: { access_token: t-42 } }
      - request: GET /login
        follow: true
        expect: { status: 200, json: { token: t-42 } }

  - name: "*.domain sends every subdomain to one stub, which sees the host"
    steps:
      - stub: groups
        on: GET /ja.atom
        reply: { body: "feed of {{call.headers.host}}" }
      - request: GET /feed?group=findy
        expect: { json: { feed: feed of findy.groups.test } }
      - request: GET /feed?group=mercari
        expect: { json: { feed: feed of mercari.groups.test } }
      - received: groups
        call: GET /ja.atom
        times: 2

  - name: a stub streams Server-Sent Events, with what was asked
    steps:
      - stub: weather
        on: POST /v1/forecast/stream
        reply:
          sse:
            - { event: start, data: { text: "" } }
            - { event: delta, data: { text: "sunny " } }
            - { event: delta, data: { text: "from {{call.headers.host}}" } }
            - { event: stop, data: {} }
      - request: GET /ask
        expect: { json: { contentType: text/event-stream, text: sunny from api.weather.test } }
