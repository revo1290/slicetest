# yaml-language-server: $schema=https://unpkg.com/slicetest/schema/scenario.schema.json
scenarios:
  - name: creating an item stores it
    steps:
      - request: POST /items
        json: { item: { name: tea } }
        expect: { status: 201, json: { id: 1, name: tea } }
      - db: items
        where: { name: tea }
        expect: { count: 1 }
      - changes: { items: { inserted: 1 } }
  - name: the next scenario starts empty, with ids from 1 again
    steps:
      - request: POST /items
        json: { item: { name: coffee } }
        expect: { status: 201, json: { id: 1 } }
